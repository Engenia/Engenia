# Jeykill settings   see https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/about-github-pages-and-jekyll#configuring-jekyll-in-your-github-pages-site
# use only settings mentioned in https://github.com/markusos/markusos.github.io/blob/master/_config.yml

baseurl: "/Engenia"

# Build settings  
kramdown:
  syntax_highlighter: rouge
plugins: 
  - jekyll-paginate
  - jekyll-sitemap

collections:
  post_tags:
    permalink: /tags/:name/
    output: true

defaults:
  - scope:
      path: ''
      type: post_tags
    values:
      permalink: "/tags/:name/"
      layout: tag
